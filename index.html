<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carros 2D</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png"><meta name="theme-color" content="#15161a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f1eee7;--fg:#1d1d1b;--card:#fff;--ac:#e8452c;--mut:#777;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#f2f2f2;--card:#23252b;--mut:#9aa}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#f2f2f2;--card:#23252b;--mut:#9aa}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas#c{display:block;width:100%;height:100%}
#menu{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px));box-sizing:border-box;overflow:auto;touch-action:pan-y}
h1{margin:0;font-size:24px}
.top{display:flex;justify-content:space-between;align-items:center}
.coins{font-weight:800;font-size:18px;background:var(--card);padding:6px 12px;border-radius:20px}
.hero{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
#nm{flex:1;min-width:140px;padding:11px 12px;border-radius:12px;border:2px solid transparent;background:var(--card);color:var(--fg);font-size:16px;font-weight:600}
#nm:focus{outline:0;border-color:var(--ac)}
#rec{display:flex;gap:6px;flex-wrap:wrap}#rec span{font-weight:800;background:linear-gradient(135deg,#ffb300,#ff7a00);color:#fff;padding:9px 12px;border-radius:12px;font-size:14px}#last:empty{display:none}#last{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;border-left:6px solid #2a9d5b;font-size:14px;line-height:1.7}
#msg{color:var(--mut);font-size:13px;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:11px;border:0;border-radius:12px;background:var(--card);color:var(--fg);font-weight:700;font-size:15px}
.tab.on{background:var(--ac);color:#fff}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);border:2px solid transparent}
.card.cur{border-color:#2a9d5b}
.card.lock .pv{filter:grayscale(.8) brightness(.75)}
.pv{width:70px;height:100px;border-radius:12px;flex:none;background:linear-gradient(#5a6270,#2e323b) center/cover;object-fit:contain;padding:4px;box-sizing:border-box}
.pv.mp{padding:0}
.card .i{flex:1;font-size:12px;color:var(--mut)}
.card .i b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.st{display:flex;align-items:center;gap:6px;margin-top:3px}.st span{width:62px}
.bar{flex:1;height:6px;background:rgba(128,128,128,.25);border-radius:3px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.card button{padding:11px 14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:14px}
.card button.sel{background:#2a9d5b}
.card button:disabled{opacity:.4}
#play{position:sticky;bottom:0;margin-top:14px;padding:16px;border:0;border-radius:16px;background:#2a9d5b;color:#fff;font-size:20px;font-weight:800;box-shadow:0 -6px 12px var(--bg)}
.banner{background:linear-gradient(135deg,#ff7a00,#e8452c 60%,#b3261e);border-radius:18px;padding:12px 14px 0;margin-bottom:10px;overflow:hidden;box-shadow:0 6px 18px rgba(232,69,44,.35)}.banner h1{color:#fff;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.25)}.banner .coins{background:rgba(0,0,0,.3);color:#ffe27a}.flag{height:10px;margin:-12px -14px 10px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/10px 10px}#hero{height:120px;margin:10px -14px 0;background:#333 center/cover;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 40px rgba(0,0,0,.55)}#hcar{height:96px;transform:rotate(var(--r,180deg));filter:drop-shadow(0 8px 6px rgba(0,0,0,.5));animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(var(--r,180deg))}}#hero::before,#hero::after{content:'🏁';position:absolute;top:8px;left:14px;font-size:22px}#hero::after{content:'🏆';left:auto;right:14px}.tab.on{background:linear-gradient(135deg,#ff7a00,#e8452c)}#play{background:linear-gradient(135deg,#34c46b,#1f8f4a);animation:pulse 1.8s infinite}@keyframes pulse{50%{transform:scale(1.025)}}.card.cur{box-shadow:0 0 0 2px #2a9d5b,0 6px 18px rgba(42,157,91,.35)}
.fx{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:none;animation:fxin .25s ease-out}
.fx img{height:210px;filter:drop-shadow(0 0 26px gold);animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
.mpv{width:210px;height:150px;border-radius:16px;background:center/cover;box-shadow:0 0 30px gold;animation:pop .9s}
.fx b{font-size:30px;color:#fff;margin-top:14px;text-shadow:0 2px 12px #000;animation:pop .9s}.fx span{color:#ddd;margin-top:4px;font-size:16px}
.fx.out{animation:fxout .3s forwards}@keyframes fxin{from{opacity:0}}@keyframes fxout{to{opacity:0}}
@keyframes pop{0%{transform:scale(.2) rotate(-15deg);opacity:0}60%{transform:scale(1.2) rotate(4deg);opacity:1}100%{transform:scale(1)}}
.cf{position:fixed;top:-20px;width:9px;height:14px;animation:cf 1.8s ease-in forwards}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
#hcar.eq{animation:eq .8s cubic-bezier(.2,1.4,.4,1),bob 1.6s .8s ease-in-out infinite}
@keyframes eq{from{transform:translateY(80px) scale(.4) rotate(var(--r,180deg));opacity:0;filter:brightness(3) drop-shadow(0 0 20px #fff)}to{transform:translateY(0) scale(1) rotate(var(--r,180deg));opacity:1}}
.set{grid-column:1/-1;flex-direction:column;align-items:flex-start}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 12px;border:0;border-radius:12px;background:rgba(128,128,128,.2);color:var(--fg);font-weight:700;font-size:14px}.chip.on{background:linear-gradient(135deg,#ff7a00,#e8452c);color:#fff}
#wallet{background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#3a2300;border-radius:16px;padding:12px 16px;font-size:17px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(255,159,28,.35)}#wallet b{font-size:26px}
.tab{font-size:13px;padding:11px 3px}.lb{width:100%;margin-top:8px}.lbrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px solid rgba(128,128,128,.25);font-size:14px}.lbrow.me{background:rgba(255,122,0,.18);border-radius:10px}.lbrow .pos{width:30px;font-weight:800;text-align:center}.lbrow .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbrow .val{font-weight:800}.lbrow .oth{width:100%;padding-left:38px;font-size:11px;color:var(--mut)}
.pv.neon{animation:neon 3.2s linear infinite}
@keyframes neon{0%,100%{filter:drop-shadow(0 0 5px #00f0ff) drop-shadow(0 0 12px #00f0ff)}33%{filter:drop-shadow(0 0 5px #7a5cff) drop-shadow(0 0 12px #7a5cff)}66%{filter:drop-shadow(0 0 5px #ff2bd6) drop-shadow(0 0 12px #ff2bd6)}}
</style>
</head>

<canvas id="c"></canvas>
<div id="menu">
  <div class="banner"><div class="flag"></div><div class="top"><h1>🏎️ CARROS 2D</h1><div class="coins" id="coins"></div></div><div id="hero"><img id="hcar" alt=""></div></div>
  <div id="wallet"></div><div class="hero"><input id="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off"><div id="rec"></div></div>

</div>

let FBT=null;
async function fbAuth(){
  const now=Date.now();
  if(FBT&&FBT.exp>now+60000)return FBT;
  let st=null;try{st=JSON.parse(localStorage.getItem('carros2d_fb'))}catch(e){}
  let r;
  if(st&&st.rt){
    r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(st.rt)});
    if(r.ok){const j=await r.json();FBT={id:j.id_token,uid:j.user_id,exp:now+(+j.expires_in)*1000};try{localStorage.setItem('carros2d_fb',JSON.stringify({rt:j.refresh_token,uid:j.user_id}))}catch(e){}return FBT}
  }
  r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok)throw new Error('auth '+r.status);
  const j=await r.json();FBT={id:j.idToken,uid:j.localId,exp:now+(+j.expiresIn)*1000};
  try{localStorage.setItem('carros2d_fb',JSON.stringify({rt:j.refreshToken,uid:j.localId}))}catch(e){}
  return FBT;
}
async function fbLoad(){

}

async function lbSync(){
